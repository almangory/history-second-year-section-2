    <!-- 🇸🇩 جسر الدخول الموحد التلقائي من منصة المناهج السودانية (Naqla SSO Receiver) -->
    <script>
    (function() {
      try {
        const hash = window.location.hash;
        if (hash && hash.includes('naqla_sso=')) {
          const params = new URLSearchParams(hash.replace(/^#/, ''));
          const ssoData = params.get('naqla_sso');
          if (ssoData) {
            const user = JSON.parse(decodeURIComponent(escape(atob(ssoData))));
            if (user && user.ts && (Date.now() - user.ts < 10 * 60 * 1000)) {
              console.log('🇸🇩 [منصة المناهج] تم تسجيل الدخول تلقائياً للمستخدم:', user.username);
              localStorage.setItem('sudan_auth_user', JSON.stringify(user));
              localStorage.setItem('currentUser', JSON.stringify(user));
              localStorage.setItem('user', JSON.stringify(user));
              if (user.username || user.name) {
                localStorage.setItem('sub_historian_name', user.username || user.name);
              }
              params.delete('naqla_sso');
              const cleanHash = params.toString() ? '#' + params.toString() : '';
              window.history.replaceState(null, '', window.location.pathname + window.location.search + cleanHash);
            }
          }
        }
      } catch (e) {
        console.warn('Naqla SSO receiver error:', e);
      }
    })();
    </script>
  </head>
  <body class="bg-[#faf8f5] text-slate-900 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=20260908_v7', { scope: '/' })
            .then((registration) => {
              // Automatically check for updates on reload
              registration.update();
            })
            .catch((err) => {
              console.log('ServiceWorker registration skipped:', err);
            });
        });
      }
    </script>
